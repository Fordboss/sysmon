name: SysMon

options:
  bundleIdPrefix: com.sysmon
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    # 全工程不做真机签名：CI 里只 archive 出未签名包，
    # 由 TrollStore 在设备上完成签名与安装。
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_BITCODE: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    GENERATE_INFOPLIST_FILE: NO
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_ENABLE_MODULES: YES

targets:
  # ── 主 App ─────────────────────────────────────────────
  SysMon:
    type: application
    platform: iOS
    sources:
      - path: SysMon/App
      - path: SysMon/Shared
      - path: SysMon/PiP
      - path: SysMon/Views
      - path: SysMon/Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: SysMon/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.sysmon.app
        PRODUCT_NAME: SysMon
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: SysMonWidget
        embed: true

  # ── 负一屏小组件 ───────────────────────────────────────
  SysMonWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SysMon/Widget
      - path: SysMon/Shared
    settings:
      base:
        INFOPLIST_FILE: SysMon/Widget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.sysmon.app.widget
        PRODUCT_NAME: SysMonWidget
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

schemes:
  SysMon:
    build:
      targets:
        SysMon: all
        SysMonWidget: all
    run:
      config: Release
    archive:
      config: Release
